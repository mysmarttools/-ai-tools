<section class="image-compressor-tool">

  <div class="compressor-heading">
    <div class="compressor-icon">🗜️</div>
    <h1>Image Compressor</h1>
    <p>Compress JPG, PNG and WebP images online for free.</p>
  </div>

  <div class="compressor-box">

```
<div class="compress-upload" id="uploadArea">

  <div class="upload-cloud">☁️</div>

  <h2>Upload Your Image</h2>

  <p>Drag & drop your image here or browse from your device</p>

  <input
    type="file"
    id="imageInput"
    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
  >

  <label for="imageInput" class="choose-image">
    📁 Choose Image
  </label>

  <small>JPG, PNG or WebP • Maximum 20MB</small>

</div>


<div class="compress-result" id="compressResult">

  <div class="preview-wrapper">
    <img id="previewImage" alt="Uploaded image preview">
  </div>

  <div class="file-details">

    <div>
      <span>Original Size</span>
      <strong id="originalSize">-</strong>
    </div>

    <div>
      <span>Compressed Size</span>
      <strong id="compressedSize">-</strong>
    </div>

    <div>
      <span>Saved</span>
      <strong id="savedPercent">-</strong>
    </div>

  </div>


  <div class="quality-area">

    <div class="quality-top">
      <label>Compression Quality</label>
      <strong id="qualityValue">70%</strong>
    </div>

    <input
      type="range"
      id="quality"
      min="10"
      max="100"
      value="70"
    >

  </div>


  <div class="compress-actions">

    <button id="compressBtn" class="compress-main">
      🗜️ Compress Image
    </button>

    <button id="downloadBtn" class="download-main" disabled>
      ⬇️ Download
    </button>

    <button id="resetBtn" class="reset-main">
      🔄 New Image
    </button>

  </div>

</div>
```

  </div>

</section>
